# Overlay for a host that ALREADY runs a reverse proxy on 80/443
# (nginx-proxy-manager, Traefik, plain nginx). Use instead of the Caddy profile:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.proxy.yml \
#     --env-file .env.production up -d
#
# It joins the proxy's own Docker network and gives each externally-visible
# service a stable alias there, so the proxy can target it by name and this
# stack needs no published ports at all — nothing is exposed on the LAN.
#
# Point the proxy at these five (all plain HTTP; the proxy terminates TLS):
#
#   api.<domain>    ->  http://clubspace-api:3000
#   admin.<domain>  ->  http://clubspace-admin:3000
#   app.<domain>    ->  http://clubspace-app:3000
#   pwa.<domain>    ->  http://clubspace-pwa:8080
#   s3.<domain>     ->  http://clubspace-s3:9000
#
# Serving on a non-standard port (PUBLIC_PORT_SUFFIX, e.g. ":8443" when the ISP
# blocks 443)? Only the public URLs carry it; the server and the worker talk to
# storage over the internal network (S3_INTERNAL_URL), never through the proxy.
#
# On the s3 host, raise the upload limit or large videos are cut off mid-flight,
# and pass on only what browsers and phones send — GET/HEAD/PUT/OPTIONS on
# objects in the bucket; MinIO's admin API under /minio/ stays unreachable.
# For nginx / nginx-proxy-manager's "Advanced" box (bucket `clubspace`):
#
#   client_max_body_size 0;
#   proxy_request_buffering off;
#   location ~ ^/clubspace/.+ {
#       limit_except GET HEAD PUT OPTIONS { deny all; }
#       proxy_set_header Host $http_host;   # signatures cover the Host header
#       proxy_pass http://clubspace-s3:9000;
#   }
#   location / { return 403; }

networks:
  proxy_net:
    external: true
    name: ${PROXY_NETWORK:-shared-net}

services:
  server:
    networks:
      bjj_net:
      proxy_net:
        aliases:
          - clubspace-api

  admin:
    networks:
      bjj_net:
      proxy_net:
        aliases:
          - clubspace-admin

  client:
    networks:
      bjj_net:
      proxy_net:
        aliases:
          - clubspace-app

  pwa:
    networks:
      bjj_net:
      proxy_net:
        aliases:
          - clubspace-pwa

  minio:
    networks:
      bjj_net:
      proxy_net:
        aliases:
          - clubspace-s3
