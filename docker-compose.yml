# Local-only stack for the BJJ academy platform.
# Use:   docker compose up -d
# Stop:  docker compose down
# Reset: docker compose down -v   (drops volumes — wipes DB, Redis, MinIO)
#
# All credentials below are dev defaults. Do not use in production.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clubspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clubspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub no longer serves minio/* (see docker-compose.prod.yml). Root,
    # so a minio_data volume written by the old official image still opens.
    image: cgr.dev/chainguard/minio:latest-dev
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket bootstrap. Creates the default bucket and makes it
  # publicly readable so HLS streams can be served without signed URLs in dev.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    # Keep the bucket PRIVATE: video (hls/, raw/) and any other content must
    # only be reachable through the membership-checked manifest proxy + signed
    # URLs, never by guessing a key. Only the non-sensitive thumbnail and
    # subtitle prefixes are anonymously readable so the apps can load them
    # directly — plus playlists/, where course covers lived before they moved
    # under thumbnails/. (Prod must mirror this bucket policy — see deploy/README.)
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio miniominio &&
      mc mb --ignore-existing local/clubspace &&
      mc anonymous set none local/clubspace &&
      mc anonymous set download local/clubspace/thumbnails &&
      mc anonymous set download local/clubspace/subtitles &&
      mc anonymous set download local/clubspace/playlists
      "
    restart: "no"

  maildev:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "1080:1080"  # Web UI

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # The image sets NODE_ENV=production. This is the *local* stack (dev
      # defaults below, see file header), so run the server in development mode —
      # otherwise the production gates (assertProductionSecrets requiring ≥32-char
      # JWT_SECRET/PLAYBACK_TOKEN_SECRET, required workspace-admin password, etc.)
      # reject these intentionally-weak local secrets. Real deploys set
      # NODE_ENV=production with real secrets via other orchestration.
      NODE_ENV: development
      SERVER_PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/clubspace?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_ISSUER_URL: http://localhost:3000
      JWT_AUDIENCE_URL: http://localhost:3000
      JWT_ACCESS_TOKEN_TTL: 900
      JWT_REFRESH_TOKEN_TTL: 2592000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}

      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-dev-encryption-secret-change-me}

      # HMAC secret for short-lived HLS playback tokens. Required when
      # NODE_ENV=production (which this image sets); must differ from JWT_SECRET.
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-dev-playback-secret-change-me}

      ROOT_URL: http://localhost:3000
      ORGANIZATION_NAME: BJJ_Academy

      SUPER_ADMIN_EMAIL: admin@super.com
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin}
      # Required in production (bootstrap-seed guard) even when the workspace is
      # already seeded — the guard runs before the "already exists" check.
      DEFAULT_WORKSPACE_ADMIN_PASSWORD: ${DEFAULT_WORKSPACE_ADMIN_PASSWORD:-ChangeMe123!}

      SMTP_URL: smtp://maildev:1025
      SMTP_NO_REPLY_EMAIL: noreply@clubspace.local

      S3_UPLOAD_BUCKET_URL: http://minio:9000
      S3_REGION: us-west-1
      S3_BUCKET_NAME: clubspace
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: miniominio
      S3_FORCE_PATH_STYLE: "true"
      S3_ACL: public-read

      COMPLETE_CODE_TIMEOUT: 60

      CORS_ORIGINS: http://localhost:3000,http://localhost:4200,http://localhost:4201

      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  video-worker:
    build:
      context: .
      dockerfile: apps/video-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/clubspace?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_UPLOAD_BUCKET_URL: http://minio:9000
      S3_REGION: us-west-1
      S3_BUCKET_NAME: clubspace
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: miniominio
      S3_FORCE_PATH_STYLE: "true"

volumes:
  postgres_data:
  redis_data:
  minio_data:
