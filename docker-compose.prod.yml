# Production stack for the ClubSpace platform.
#
# Bring-up:    docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Update:      docker compose -f docker-compose.prod.yml build server video-worker && \
#              docker compose -f docker-compose.prod.yml up -d
# Logs:        docker compose -f docker-compose.prod.yml logs -f server
#
# Postgres and Redis are NOT exposed to the host — they're reachable only on
# the internal `bjj_net` network. Caddy terminates TLS and reverse-proxies
# the API on ports 80/443.

name: clubspace

# Docker's default json-file driver never rotates. On a home server, Caddy
# logging every video segment request would slowly fill the disk Postgres lives
# on — so every service caps its logs at 5 × 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  bjj_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clubspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clubspace}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Require a password — the server connects with REDIS_PASSWORD, and a
    # passwordless Redis on the shared network would be both broken (AUTH
    # mismatch) and a weakness. $$ escapes Compose interpolation so the
    # container shell reads its own REDIS_PASSWORD env var.
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing community images (Oct 2025), archived the repo
    # (Apr 2026) and removed them from Docker Hub (Sep 2026); quay.io no longer
    # serves anonymous pulls either. Chainguard builds it from source and
    # publishes it free. `-dev` is the variant with a shell, which the
    # healthcheck below needs. Override with MINIO_IMAGE to use another build.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest-dev}
    # The old official image ran as root, so an existing minio_data volume is
    # root-owned; Chainguard's default non-root user can't open it ("file
    # access denied … Unable to write to the backend"). Keep root.
    user: "0:0"
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      # The server and worker authenticate with these same values via
      # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY, so there is one pair of
      # credentials, not two.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - minio_data:/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot bucket bootstrap, mirroring the dev stack's policy exactly.
  # The bucket stays PRIVATE: course video (hls/, raw/) is only reachable
  # through the membership-checked manifest proxy, which signs short-lived
  # segment URLs. Only thumbnails and subtitles are anonymously readable,
  # because getPublicObjectUrl() hands those out unsigned.
  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-clubspace}
    # $$ escapes Compose interpolation so the container shell expands its own
    # environment rather than Compose expanding it at parse time.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME &&
      mc anonymous set none local/$$S3_BUCKET_NAME &&
      mc anonymous set download local/$$S3_BUCKET_NAME/thumbnails &&
      mc anonymous set download local/$$S3_BUCKET_NAME/subtitles
      "
    networks:
      - bjj_net
    restart: "no"
    logging: *default-logging

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.production
    environment:
      # Overrides that must point at the compose service names regardless
      # of what .env.production says.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clubspace}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      PRODUCTION: "1"
      # Derived from DOMAIN so there is exactly one place to change hostnames.
      # PUBLIC_PORT_SUFFIX is empty on 443 and ":8443" (say) when the ISP blocks
      # the standard port — it has to appear in every public URL, because these
      # are what browsers open, what tokens are validated against, and what
      # upload signatures are computed over.
      # S3_UPLOAD_BUCKET_URL must be the PUBLIC url: it is what presigned upload
      # and segment URLs are signed for, and browsers/phones fetch them directly.
      ROOT_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      JWT_ISSUER_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      JWT_AUDIENCE_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      CORS_ORIGINS: https://admin.${DOMAIN}${PUBLIC_PORT_SUFFIX:-},https://app.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      S3_UPLOAD_BUCKET_URL: https://s3.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      S3_FORCE_PATH_STYLE: "true"
      # Required by both apps' env validation; MinIO accepts any value. Set
      # here so an install whose .env.production predates it still boots.
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  video-worker:
    build:
      context: .
      dockerfile: apps/video-worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.production
    environment:
      # Same service-name overrides as the server, plus NODE_ENV.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clubspace}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      PRODUCTION: "1"
      S3_UPLOAD_BUCKET_URL: https://s3.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      S3_FORCE_PATH_STYLE: "true"
      # Required by both apps' env validation; MinIO accepts any value. Set
      # here so an install whose .env.production predates it still boots.
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Wait for the server so the schema (prisma db push on boot) exists
      # before the worker reads/writes Video rows.
      server:
        condition: service_healthy
    networks:
      - bjj_net

  # Verified nightly database dump — see deploy/backup-db.sh. Runs once at
  # start (so every deploy takes one), then every BACKUP_INTERVAL_HOURS.
  # BACKUP_DIR is a HOST path, so dumps survive `docker compose down -v`; point
  # it at a second disk or a NAS mount so they also survive this disk dying.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/backup-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clubspace}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Optional healthchecks.io-style URL: pinged on success, <url>/fail on
      # failure (database OR media), so a backup that stops is noticed.
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - ${BACKUP_DIR:-/var/backups/clubspace}:/backups
      - ./deploy/backup-db.sh:/backup-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bjj_net

  # Incremental mirror of the object store (every uploaded video) — see
  # deploy/backup-media.sh. One growing copy, not a weekly full tarball.
  media-backup:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev}
    # Root, like db-backup: BACKUP_DIR is a host directory docker creates as
    # root, and the image's non-root user couldn't write into it.
    user: "0:0"
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/backup-media.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-clubspace}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${BACKUP_DIR:-/var/backups/clubspace}:/backups
      - ./deploy/backup-media.sh:/backup-media.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - bjj_net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the public API URL.
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - bjj_net

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - bjj_net

  # Only started with `--profile caddy`.
  #
  # The published ports default to 80/443 but are configurable, and that is the
  # point on a host that already runs another reverse proxy. Give this one 8080
  # and 8443, then have the router forward external 80 -> 8080 and 443 -> 8443:
  # the public URLs stay clean, this stack is the only thing the internet can
  # reach, and the existing proxy keeps serving the rest of the house on 80/443
  # without ever being exposed. Certificates still work — ACME HTTP-01 arrives
  # on external 80, which the router hands to this container.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      server:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      bjj_net:
        # The server and worker reach storage by its public name so signatures
        # validate — but resolving that name inside the network keeps transcode
        # traffic off the household uplink and works on routers with no NAT
        # hairpinning. The certificate is the real one and matches this name.
        aliases:
          - s3.${DOMAIN}
