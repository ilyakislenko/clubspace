# Production stack for the ClubSpace platform.
#
# First install on a VDS: deploy/bootstrap.sh (see deploy/README.md).
# Bring-up:    docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Update:      sudo ./deploy/update.sh   (backup, build, migrate, switch, roll back on failure)
# Logs:        docker compose -f docker-compose.prod.yml logs -f server
#
# Postgres and Redis are NOT exposed to the host — they're reachable only on
# the internal `bjj_net` network. Caddy terminates TLS and reverse-proxies
# the API on ports 80/443.

name: clubspace

# Docker's default json-file driver never rotates. On a home server, Caddy
# logging every video segment request would slowly fill the disk Postgres lives
# on — so every service caps its logs at 5 × 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  bjj_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clubspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clubspace}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Require a password — the server connects with REDIS_PASSWORD, and a
    # passwordless Redis on the shared network would be both broken (AUTH
    # mismatch) and a weakness. $$ escapes Compose interpolation so the
    # container shell reads its own REDIS_PASSWORD env var.
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing community images (Oct 2025), archived the repo
    # (Apr 2026) and removed them from Docker Hub (Sep 2026); quay.io no longer
    # serves anonymous pulls either. Chainguard builds it from source and
    # publishes it free — but only as floating `latest`/`latest-dev` tags, so
    # the image is pinned by digest (the `-dev` variant, which has the shell
    # the healthcheck needs). To move forward deliberately:
    #   docker buildx imagetools inspect cgr.dev/chainguard/minio:latest-dev
    # and paste the new digest here and in docker-compose.yml. Override with
    # MINIO_IMAGE to use another build.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:3117ce7ad401284dbf57a1a5e1b8abe3984630bb51e4341d69754599977f3dae}
    # The old official image ran as root, so an existing minio_data volume is
    # root-owned; Chainguard's default non-root user can't open it ("file
    # access denied … Unable to write to the backend"). Keep root.
    user: "0:0"
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      # Root credentials. Only minio-init and media-backup use them; the server
      # and the worker get their own service accounts (see minio-init).
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - minio_data:/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot storage bootstrap — see deploy/minio-init.sh. Creates the private
  # bucket with the same anonymous-read prefixes as the dev stack, and the
  # least-privilege service accounts the server and the worker sign in with.
  # Idempotent; rerun with `up minio-init` after changing a service secret.
  minio-init:
    # Pinned by digest for the same reason as minio above.
    image: &minio-client-image ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client@sha256:a8a0480cb7356bf1c1f6e348b483a161c727a5c77ca574899e5a045686492bbe}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-clubspace}
      S3_SERVER_ACCESS_KEY_ID: ${S3_SERVER_ACCESS_KEY_ID:-clubspace-server}
      S3_SERVER_SECRET_ACCESS_KEY: ${S3_SERVER_SECRET_ACCESS_KEY:?S3_SERVER_SECRET_ACCESS_KEY is required (openssl rand -hex 32)}
      S3_WORKER_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:-clubspace-worker}
      S3_WORKER_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?S3_WORKER_SECRET_ACCESS_KEY is required (openssl rand -hex 32)}
    volumes:
      - ./deploy/minio-init.sh:/minio-init.sh:ro
    networks:
      - bjj_net
    restart: "no"
    logging: *default-logging

  server:
    # Locally built. The clubspace.local "registry" does not exist, so a pull
    # can never fetch a stranger's image under this name; deploy/update.sh
    # keeps the previous build as :rollback.
    image: clubspace.local/server:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.production
    environment:
      # Overrides that must point at the compose service names regardless
      # of what .env.production says.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clubspace}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      PRODUCTION: "1"
      # Derived from DOMAIN so there is exactly one place to change hostnames.
      # PUBLIC_PORT_SUFFIX is empty on 443 and ":8443" (say) when the ISP blocks
      # the standard port — it has to appear in every public URL, because these
      # are what browsers open, what tokens are validated against, and what
      # upload signatures are computed over.
      # S3_UPLOAD_BUCKET_URL must be the PUBLIC url: it is what presigned upload
      # and segment URLs are signed for, and browsers/phones fetch them directly.
      ROOT_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      # Where people open the admin and the member web app (links in e-mails,
      # the join QR code). ROOT_URL is the API host, which is not one of them.
      ADMIN_URL: https://admin.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      APP_URL: https://app.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      JWT_ISSUER_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      JWT_AUDIENCE_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      CORS_ORIGINS: https://admin.${DOMAIN}${PUBLIC_PORT_SUFFIX:-},https://app.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      S3_UPLOAD_BUCKET_URL: https://s3.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      # The server's own storage calls (deletes, listings, reads) go straight
      # to MinIO on the internal network, so the public s3. site only has to
      # accept what browsers send (see deploy/Caddyfile).
      S3_INTERNAL_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      # Required by both apps' env validation; MinIO accepts any value. Set
      # here so an install whose .env.production predates it still boots.
      S3_REGION: ${S3_REGION:-us-east-1}
      # Same value is baked into the client's /legal/consent page.
      CONSENT_VERSION: ${CONSENT_VERSION:-2026-11-01}
      # Host-side ops secrets (deploy/backup-s3.sh, healthcheck.sh) share
      # .env.production; blank them so the app never holds the keys to its own
      # backups.
      BACKUP_ENCRYPTION_KEY: ""
      BACKUP_S3_ACCESS_KEY_ID: ""
      BACKUP_S3_SECRET_ACCESS_KEY: ""
      ALERT_TELEGRAM_BOT_TOKEN: ""
      # The server's own least-privilege account (created by minio-init),
      # replacing the root pair .env.production carries under these names.
      S3_ACCESS_KEY_ID: ${S3_SERVER_ACCESS_KEY_ID:-clubspace-server}
      S3_SECRET_ACCESS_KEY: ${S3_SERVER_SECRET_ACCESS_KEY:?S3_SERVER_SECRET_ACCESS_KEY is required (openssl rand -hex 32)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Its storage account exists only once minio-init has run.
      minio-init:
        condition: service_completed_successfully
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  video-worker:
    image: clubspace.local/video-worker:latest
    build:
      context: .
      dockerfile: apps/video-worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # No env_file: the worker parses untrusted uploads, so it gets exactly the
    # variables it reads and none of the server's secrets (JWT, SMTP, root
    # storage keys).
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clubspace}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      NODE_ENV: production
      PRODUCTION: "1"
      # Public origin: only used to build the stored playback URL.
      S3_UPLOAD_BUCKET_URL: https://s3.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      S3_INTERNAL_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-clubspace}
      # Least-privilege account from minio-init: read raw/, write hls/.
      S3_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:-clubspace-worker}
      S3_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?S3_WORKER_SECRET_ACCESS_KEY is required (openssl rand -hex 32)}
      VIDEO_TRANSCODE_TIMEOUT_MS: ${VIDEO_TRANSCODE_TIMEOUT_MS:-1800000}
      TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-5120}
      MAX_VIDEO_DURATION_MINUTES: ${MAX_VIDEO_DURATION_MINUTES:-240}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Wait for the server so the schema (prisma db push on boot) exists
      # before the worker reads/writes Video rows.
      server:
        condition: service_healthy
    networks:
      - bjj_net

  # Verified nightly database dump — see deploy/backup-db.sh. Dumps when the
  # container starts, then every BACKUP_INTERVAL_HOURS. `up -d` doesn't restart
  # it when unchanged, so updates take a fresh dump via deploy/backup-now.sh.
  # BACKUP_DIR is a HOST path, so dumps survive `docker compose down -v`; point
  # it at a second disk or a NAS mount so they also survive this disk dying.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/backup-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clubspace}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Optional healthchecks.io-style URL: pinged on success, <url>/fail on
      # failure (database OR media), so a backup that stops is noticed.
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - ${BACKUP_DIR:-/var/backups/clubspace}:/backups
      - ./deploy/backup-db.sh:/backup-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bjj_net

  # Incremental mirror of the object store (every uploaded video) — see
  # deploy/backup-media.sh. One growing copy, not a weekly full tarball.
  media-backup:
    image: *minio-client-image
    # Root, like db-backup: BACKUP_DIR is a host directory docker creates as
    # root, and the image's non-root user couldn't write into it.
    user: "0:0"
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/backup-media.sh"]
    environment:
      # Root: a full mirror has to read every object. This container is
      # internal-only and holds no other secrets.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-clubspace}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # false: no local mirror (on a small VDS it would double every video on
      # the same disk) — deploy/backup-s3.sh mirrors to external S3 instead.
      MEDIA_BACKUP_LOCAL: ${MEDIA_BACKUP_LOCAL:-true}
    volumes:
      - ${BACKUP_DIR:-/var/backups/clubspace}:/backups
      - ./deploy/backup-media.sh:/backup-media.sh:ro
    depends_on:
      # Not just "minio is up": on a fresh install the bucket doesn't exist
      # until minio-init has run, and mirroring a missing bucket is a failure.
      minio-init:
        condition: service_completed_successfully
    networks:
      - bjj_net

  admin:
    image: clubspace.local/admin:latest
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the public API URL.
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - bjj_net

  client:
    image: clubspace.local/client:latest
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
        # Contact details printed on the public /legal/* pages.
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        NEXT_PUBLIC_LEGAL_OPERATOR: ${LEGAL_OPERATOR:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
        NEXT_PUBLIC_CONSENT_VERSION: ${CONSENT_VERSION:-2026-11-01}
    restart: unless-stopped
    logging: *default-logging
    # Runtime (not baked): /, /join, /c, /clubs, /.well-known, robots.txt and
    # sitemap.xml read these per request — see deploy/README.md, "Join links,
    # club pages and app links".
    environment:
      API_INTERNAL_URL: http://server:${SERVER_PORT:-3000}
      # The landing's «Попробовать» → <ADMIN_URL>/sign-up; SITE_URL makes
      # canonical, Open Graph and sitemap URLs absolute.
      ADMIN_URL: https://admin.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      SITE_URL: https://app.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      APP_STORE_URL: ${APP_STORE_URL:-}
      PLAY_STORE_URL: ${PLAY_STORE_URL:-}
      RUSTORE_URL: ${RUSTORE_URL:-}
      PWA_URL: ${PWA_URL:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID:-}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    networks:
      - bjj_net

  # Only started with `--profile caddy`.
  #
  # The published ports default to 80/443 but are configurable, and that is the
  # point on a host that already runs another reverse proxy. Give this one 8080
  # and 8443, then have the router forward external 80 -> 8080 and 443 -> 8443:
  # the public URLs stay clean, this stack is the only thing the internet can
  # reach, and the existing proxy keeps serving the rest of the house on 80/443
  # without ever being exposed. Certificates still work — ACME HTTP-01 arrives
  # on external 80, which the router hands to this container.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      # The s3. site only lets requests for objects in this bucket through.
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-clubspace}
    depends_on:
      server:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bjj_net
