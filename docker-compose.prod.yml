# Production stack for the ClubSpace platform.
#
# Bring-up:    docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Update:      docker compose -f docker-compose.prod.yml build server && \
#              docker compose -f docker-compose.prod.yml up -d server
# Logs:        docker compose -f docker-compose.prod.yml logs -f server
#
# Postgres and Redis are NOT exposed to the host — they're reachable only on
# the internal `bjj_net` network. Caddy terminates TLS and reverse-proxies
# the API on ports 80/443.

name: clubspace

networks:
  bjj_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clubspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clubspace}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Require a password — the server connects with REDIS_PASSWORD, and a
    # passwordless Redis on the shared network would be both broken (AUTH
    # mismatch) and a weakness. $$ escapes Compose interpolation so the
    # container shell reads its own REDIS_PASSWORD env var.
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Overrides that must point at the compose service names regardless
      # of what .env.production says.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clubspace}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      PRODUCTION: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bjj_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  video-worker:
    build:
      context: .
      dockerfile: apps/video-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Same service-name overrides as the server, plus NODE_ENV.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clubspace}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      PRODUCTION: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the server so the schema (prisma db push on boot) exists
      # before the worker reads/writes Video rows.
      server:
        condition: service_healthy
    networks:
      - bjj_net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the public API URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    networks:
      - bjj_net

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    networks:
      - bjj_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bjj_net
