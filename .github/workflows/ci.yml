name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Disable Nx Cloud — the workspace has an nxCloudId set in nx.json,
  # but CI doesn't have an access token. Without this every nx target
  # tries to authorize and fails. Local devs still use the cache.
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  # Survive transient npm-registry blips: retry fetches more, with longer
  # backoff, instead of failing the whole install on a single network hiccup.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_FACTOR: '2'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '180000'
  # Dummy values so module-init env reads don't fail. We never touch
  # the real DB / S3 / SMTP in this workflow — typecheck and unit tests
  # use stubs.
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bjj_academy_test
  ROOT_URL: http://localhost:3000
  JWT_ISSUER_URL: http://localhost:3000
  JWT_AUDIENCE_URL: http://localhost:3000
  JWT_SECRET: ci-jwt-secret-do-not-use-in-prod-but-long-enough
  PLAYBACK_TOKEN_SECRET: ci-playback-secret-do-not-use-in-prod-but-long-enough
  ENCRYPTION_SECRET: ci-encryption-secret-do-not-use-in-prod
  SUPER_ADMIN_EMAIL: ci@bjj-academy.test
  SUPER_ADMIN_PASSWORD: ci-admin-password
  SMTP_URL: smtps://user:pass@smtp.example.com:465
  SMTP_NO_REPLY_EMAIL: noreply@example.com
  CORS_ORIGINS: http://localhost:3000
  S3_UPLOAD_BUCKET_URL: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET_NAME: ci-bucket
  S3_ACCESS_KEY_ID: ci
  S3_SECRET_ACCESS_KEY: ci-secret
  S3_FORCE_PATH_STYLE: true
  S3_ACL: private

jobs:
  install:
    name: Install + cache deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (retry on transient failure)
        run: |
          n=0
          until npm ci; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "npm ci failed after $n attempts" >&2
              exit 1
            fi
            echo "npm ci failed (attempt $n) — retrying in 15s..."
            sleep 15
          done

      - name: Generate Prisma client (retry on transient failure)
        run: |
          n=0
          until npx prisma generate --schema=apps/server/prisma/schema.prisma; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "prisma generate failed after $n attempts" >&2
              exit 1
            fi
            echo "prisma generate failed (attempt $n) — retrying in 10s..."
            sleep 10
          done

      - name: Cache node_modules + prisma client
        # Caching is an optimization — a save conflict / network blip must not
        # fail the pipeline (dependent jobs fall back to `npm ci` on a miss).
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: server, path: apps/server, tsconfig: tsconfig.app.json }
          - { name: admin, path: apps/admin, tsconfig: tsconfig.json }
          - { name: client, path: apps/client, tsconfig: tsconfig.json }
          - { name: mobile, path: apps/bjj-academy-mobile, tsconfig: tsconfig.app.json }
          - { name: video-worker, path: apps/video-worker, tsconfig: tsconfig.app.json }
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      - name: Build referenced libs (api-client, prisma-client)
        # tsconfig.app.json files declare project references to the lib
        # outputs (libs/api-client for server+mobile, libs/prisma-client for
        # video-worker), so tsc expects the .d.ts to exist before it can
        # typecheck. Locally the dist is gitignored but present from earlier
        # builds; in CI it isn't.
        run: npx nx run-many -t build -p @bjj-academy/api-client,@bjj-academy/prisma-client

      - name: Typecheck ${{ matrix.project.name }}
        working-directory: ${{ matrix.project.path }}
        run: npx tsc --noEmit -p ${{ matrix.project.tsconfig }}

  openapi:
    name: OpenAPI spec in sync
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}
      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi
      - name: Build referenced libs
        run: npx nx run-many -t build -p @bjj-academy/api-client,@bjj-academy/prisma-client
      # Regenerate the spec (headless, no DB — preview mode) and fail if the
      # committed open-api.json drifted from the server's actual routes.
      - name: Regenerate OpenAPI spec
        run: npx nx open-api:generate @bjj-academy/server
      - name: Fail on spec drift
        run: git diff --exit-code -- open-api.json
      # Regenerate the shared typed client (@bjj-academy/api-client/openapi)
      # from that spec and fail if it drifted — keeps the frontends' single
      # source of truth for request/response shapes honest.
      - name: Regenerate API types
        run: npx nx types:generate @bjj-academy/api-client
      - name: Fail on API-types drift
        run: git diff --exit-code -- libs/api-client/src/openapi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: server, project: '@bjj-academy/server' }
          - { name: mobile, project: '@bjj-academy/bjj-academy-mobile' }
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      - name: Test ${{ matrix.target.name }}
        run: npx nx test ${{ matrix.target.project }} --skip-nx-cache --output-style=stream

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      - name: ESLint (changed projects)
        # nx affected runs only what's changed against the base — fast
        # on a PR with a small diff, full on main.
        # BLOCKING: errors fail the build, warnings don't (eslint exits 0 on
        # warnings). The flat config now registers react-hooks in every
        # frontend, so rules-of-hooks is enforced; remaining warnings
        # (no-explicit-any, non-null-assertion, etc.) are advisory cleanup.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t lint --base=origin/main --output-style=stream
          else
            npx nx run-many -t lint --output-style=stream
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        project:
          - server
          - admin
          - client
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      - name: Build ${{ matrix.project }}
        run: npx nx build @bjj-academy/${{ matrix.project }}
