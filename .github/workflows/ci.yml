name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - server
          - admin
          - client
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        if: matrix.project == 'server'
        run: npx nx prisma:generate @bjj-academy/server

      - name: Typecheck
        if: matrix.project == 'server'
        run: npx nx typecheck @bjj-academy/server

      - name: Build
        run: npx nx build @bjj-academy/${{ matrix.project }}
