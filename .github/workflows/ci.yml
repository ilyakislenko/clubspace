name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Disable Nx Cloud — the workspace has an nxCloudId set in nx.json,
  # but CI doesn't have an access token. Without this every nx target
  # tries to authorize and fails. Local devs still use the cache.
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  # Survive transient npm-registry blips: retry fetches more, with longer
  # backoff, instead of failing the whole install on a single network hiccup.
  # Workflow-level so the downstream jobs' cache-miss fallback installs inherit
  # it too.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_FACTOR: '2'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '180000'
  # Dummy values so module-init env reads don't fail. We never touch
  # the real DB / S3 / SMTP in this workflow — typecheck and unit tests
  # use stubs.
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clubspace_test
  ROOT_URL: http://localhost:3000
  JWT_ISSUER_URL: http://localhost:3000
  JWT_AUDIENCE_URL: http://localhost:3000
  JWT_SECRET: ci-jwt-secret-do-not-use-in-prod-but-long-enough
  PLAYBACK_TOKEN_SECRET: ci-playback-secret-do-not-use-in-prod-but-long-enough
  ENCRYPTION_SECRET: ci-encryption-secret-do-not-use-in-prod
  SUPER_ADMIN_EMAIL: ci@clubspace.test
  SUPER_ADMIN_PASSWORD: ci-admin-password
  SMTP_URL: smtps://user:pass@smtp.example.com:465
  SMTP_NO_REPLY_EMAIL: noreply@example.com
  CORS_ORIGINS: http://localhost:3000
  S3_UPLOAD_BUCKET_URL: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET_NAME: ci-bucket
  S3_ACCESS_KEY_ID: ci
  S3_SECRET_ACCESS_KEY: ci-secret
  S3_FORCE_PATH_STYLE: true
  S3_ACL: private

jobs:
  install:
    name: Install + cache deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # This job gates every other job (`needs: install`), so a single transient
      # `npm ci` / `prisma generate` failure here skips the whole pipeline. Retry
      # a couple of times before giving up. (Downstream jobs already self-heal a
      # cache-miss with their own `npm ci` fallback — this covers the case where
      # install itself blips.)
      - name: Install dependencies (retry on transient failure)
        run: |
          n=0
          until npm ci; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "npm ci failed after $n attempts" >&2
              exit 1
            fi
            echo "npm ci failed (attempt $n) — retrying in 15s..."
            sleep 15
          done

      - name: Generate Prisma client (retry on transient failure)
        run: |
          n=0
          until npx prisma generate --schema=apps/server/prisma/schema.prisma; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "prisma generate failed after $n attempts" >&2
              exit 1
            fi
            echo "prisma generate failed (attempt $n) — retrying in 10s..."
            sleep 10
          done

      - name: Cache node_modules + prisma client
        # Caching is an optimization — a save conflict / network blip must not
        # fail the pipeline (dependent jobs fall back to `npm ci` on a miss).
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: server, path: apps/server, tsconfig: tsconfig.app.json }
          - { name: admin, path: apps/admin, tsconfig: tsconfig.json }
          - { name: client, path: apps/client, tsconfig: tsconfig.json }
          - { name: mobile, path: apps/mobile, tsconfig: tsconfig.app.json }
          - { name: video-worker, path: apps/video-worker, tsconfig: tsconfig.app.json }
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      - name: Build referenced libs (api-client, prisma-client)
        # tsconfig.app.json files declare project references to the lib
        # outputs (libs/api-client for server+mobile, libs/prisma-client for
        # video-worker), so tsc expects the .d.ts to exist before it can
        # typecheck. Locally the dist is gitignored but present from earlier
        # builds; in CI it isn't.
        run: npx nx run-many -t build -p @clubspace/api-client,@clubspace/prisma-client

      - name: Typecheck ${{ matrix.project.name }}
        working-directory: ${{ matrix.project.path }}
        run: npx tsc --noEmit -p ${{ matrix.project.tsconfig }}

  openapi:
    name: OpenAPI spec in sync
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}
      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi
      - name: Build referenced libs
        run: npx nx run-many -t build -p @clubspace/api-client,@clubspace/prisma-client
      # Regenerate the spec (headless, no DB — preview mode) and fail if the
      # committed open-api.json drifted from the server's actual routes.
      - name: Regenerate OpenAPI spec
        run: npx nx open-api:generate @clubspace/server
      - name: Fail on spec drift
        run: git diff --exit-code -- open-api.json
      # Regenerate the shared typed client (@clubspace/api-client/openapi)
      # from that spec and fail if it drifted — keeps the frontends' single
      # source of truth for request/response shapes honest.
      - name: Regenerate API types
        run: npx nx types:generate @clubspace/api-client
      - name: Fail on API-types drift
        run: git diff --exit-code -- libs/api-client/src/openapi
      # Regenerate the theme CSS from the canonical token data and fail if the
      # committed globals.css drifted — themes.ts is the single source of truth.
      - name: Regenerate theme CSS
        run: npm run theme:generate
      - name: Fail on theme-CSS drift
        run: git diff --exit-code -- libs/ui-kit/util/globals.css

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: server, project: '@clubspace/server' }
          - { name: admin, project: '@clubspace/admin' }
          - { name: mobile, project: '@clubspace/mobile' }
          - { name: video-worker, project: '@clubspace/video-worker' }
          - { name: api-client, project: '@clubspace/api-client' }
          - { name: client, project: '@clubspace/client' }
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      # --coverage is load-bearing: the jest configs carry coverageThreshold
      # ratchets, so this is the step that fails when new code arrives without
      # tests. Without the flag the thresholds are never evaluated and the
      # suite passes on a branch that dropped coverage.
      - name: Test ${{ matrix.target.name }}
        run: npx nx test ${{ matrix.target.project }} --coverage --skip-nx-cache --output-style=stream

  # The only job that boots the real AppModule against a real Postgres. The
  # unit suites mock Prisma and typecheck never links the DI container, so both
  # stay green while the server cannot actually start — which is exactly what
  # happened in #252 (a service came to depend on an ad-hoc AppModule provider
  # invisible to sub-modules) and was only caught later.
  e2e:
    name: E2E (server)
    runs-on: ubuntu-latest
    needs: install
    services:
      # Versions match docker-compose.yml so CI and `npm run dev:infra` agree.
      # The suite creates its own `clubspace_e2e` database and runs
      # `prisma db push` itself, so this only has to exist and accept
      # postgres/postgres — see apps/server-e2e/src/support/global-setup.ts.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # BullMQ handshakes on boot; the suite pins itself to db 15 and flushes
      # only that one.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      # No --coverage: this suite has no ratchet of its own, and the server's
      # thresholds are already enforced by the unit job above. Via the npm
      # script so the jest worker gets the same heap ceiling as `npm run verify`.
      - name: Run e2e suite
        run: npm run test:e2e -- --skip-nx-cache --output-style=stream

  # The admin smoke e2e (apps/admin-e2e, TESTS.md «Admin smoke e2e»): the real
  # API seeds both demo clubs into an empty database at boot, run.sh builds and
  # starts the admin in production mode, Playwright signs in as owner, admin,
  # head_coach and coach and walks every route each one can see.
  admin-e2e:
    name: E2E (admin smoke)
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clubspace_admin_e2e
      SERVER_PORT: '3000'
      # The session is an HttpOnly cookie the API issues only to its own admin.
      ADMIN_URL: http://localhost:4200
      CORS_ORIGINS: http://localhost:4200
      # Demo clubs ACADEMY and «Ритм», created at boot (docs/demo.md). The code
      # opens only this throwaway database's generated accounts.
      DEMO_MODE: 'true'
      DEMO_WORKSPACE_KEY: academy-demo
      DEMO_LOGIN_CODE: '470918'
      SEED_DEMO_WORKSPACE: 'true'
      ADMIN_E2E_BASE_URL: http://localhost:4200
      ADMIN_E2E_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Creates the database too; it is empty, so there is no data loss to accept.
      - name: Create the schema
        run: npx prisma db push --config apps/server/prisma.config.ts

      - name: Build the API
        run: npx nx build @clubspace/server --skip-sync

      # Demo seeding runs in onApplicationBootstrap, before the port opens, so
      # a healthy /healthz means both clubs exist.
      - name: Start the API
        run: |
          node dist/apps/server/main.js > api.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://localhost:3000/healthz >/dev/null && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Run the admin smoke suite
        run: bash apps/admin-e2e/run.sh

      - name: Upload report and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e
          path: |
            test-output/admin-e2e
            api.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      - name: ESLint (changed projects)
        # nx affected runs only what's changed against the base — fast
        # on a PR with a small diff, full on main.
        # BLOCKING: errors fail the build, warnings don't (eslint exits 0 on
        # warnings). The flat config now registers react-hooks in every
        # frontend, so rules-of-hooks is enforced; remaining warnings
        # (no-explicit-any, non-null-assertion, etc.) are advisory cleanup.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t lint --base=origin/main --output-style=stream
          else
            npx nx run-many -t lint --output-style=stream
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        project:
          - server
          - admin
          - client
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/server/src/infrastructure/prisma/generated
            libs/prisma-client/src/generated
          key: deps-${{ runner.os }}-${{ github.sha }}

      - name: Install (fallback if cache miss)
        run: |
          if [ ! -d node_modules ]; then
            npm ci
            npx prisma generate --schema=apps/server/prisma/schema.prisma
          fi

      # admin/client build libs/api-client first (dependsOn ^build) — the same
      # command as the Docker images, including --skip-sync (apps/admin/Dockerfile).
      - name: Build ${{ matrix.project }}
        run: npx nx build @clubspace/${{ matrix.project }} --skip-sync

  # The production images are what actually ships (docker-compose.prod.yml);
  # an `nx build` that passes says nothing about a Dockerfile that forgot a
  # workspace manifest or a COPY path. Build every image, push nothing.
  # Self-contained (no `needs: install`): each Dockerfile runs its own npm ci.
  docker:
    name: Docker image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: server, dockerfile: apps/server/Dockerfile }
          - { name: video-worker, dockerfile: apps/video-worker/Dockerfile }
          - { name: admin, dockerfile: apps/admin/Dockerfile }
          - { name: client, dockerfile: apps/client/Dockerfile }
          - { name: pwa, dockerfile: apps/mobile/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          # Public URLs are baked into the frontend bundles; any value builds.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            EXPO_PUBLIC_API_URL=https://api.example.com
            EXPO_PUBLIC_WEB_URL=https://app.example.com
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # NON-BLOCKING for now: the existing tree has not been triaged yet, so a
      # red audit would block every PR on advisories nobody has looked at.
      # Remove continue-on-error once the current high/critical findings are
      # fixed or accepted — from then on a new one should fail the build.
      - name: npm audit --omit=dev --audit-level=high
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
